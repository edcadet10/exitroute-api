openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ExitRoute API
  version: 0.1.0-draft
  summary: Versioned, verified routes for leaving digital services
  description: >-
    Contract sketch for subscription-cancellation route graphs. The API is
    informational and never authenticates to or operates a consumer account.
  contact:
    name: ExitRoute maintainers
servers:
  - url: https://api.exitroute.example
    description: Placeholder production URL
  - url: http://localhost:8000
    description: Local development
tags:
  - name: system
  - name: routes
  - name: changes
  - name: observations
  - name: challenges
  - name: webhooks
security:
  - ApiKeyAuth: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Process health
      security: []
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/services/{service_slug}/exit-route:
    get:
      tags: [routes]
      operationId: getCurrentExitRoute
      summary: Get the current route for one service variant
      parameters:
        - $ref: "#/components/parameters/ServiceSlug"
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/Platform"
      responses:
        "200":
          description: Current route, including freshness state
          headers:
            ETag:
              description: Fingerprint of the immutable revision
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExitRoute"
              examples:
                verified:
                  externalValue: ./examples/exit-route.json
        "304":
          description: The client's cached revision is current
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/services/{service_slug}/exit-route/revisions:
    get:
      tags: [routes]
      operationId: listExitRouteRevisions
      summary: List published revisions for one service variant
      parameters:
        - $ref: "#/components/parameters/ServiceSlug"
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reverse-chronological revision page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionPage"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/changes:
    get:
      tags: [changes]
      operationId: listRouteChanges
      summary: Read the ordered public route-change feed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ordered change page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/observations:
    post:
      tags: [observations]
      operationId: createObservation
      summary: Submit a structured report that a route may have changed
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key scoped to the API client
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationInput"
      responses:
        "202":
          description: Observation queued for moderation; public data is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/challenges/daily:
    get:
      tags: [challenges]
      operationId: getDailyChallenge
      summary: Get a link-free playable projection of a verified route
      security: []
      parameters:
        - name: date
          in: query
          required: false
          description: UTC challenge date; defaults to today
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily challenge without entry URLs or private evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyChallenge"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/webhook-subscriptions:
    post:
      tags: [webhooks]
      operationId: createWebhookSubscription
      summary: Subscribe an API client to route-change events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionInput"
      responses:
        "201":
          description: Subscription created; signing secret is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ServiceSlug:
      name: service_slug
      in: path
      required: true
      description: Stable lowercase service identifier
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        minLength: 2
        maxLength: 80
    Region:
      name: region
      in: query
      required: false
      description: ISO 3166-1 alpha-2 region
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
        default: US
    Platform:
      name: platform
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Platform"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Requested service or variant was not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Input is structurally valid but unsafe or semantically invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: API client quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Platform:
      type: string
      enum: [web, ios, android, phone, mail, in_person]
      default: web
    Outcome:
      type: string
      enum: [cancel_subscription]
    RouteStatus:
      type: string
      enum: [verified, provisional, stale]
    Confidence:
      type: string
      enum: [high, medium, low]
    ServiceRef:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
          maxLength: 120
    Variant:
      type: object
      additionalProperties: false
      required: [region, platform]
      properties:
        region:
          type: string
          pattern: "^[A-Z]{2}$"
        platform:
          $ref: "#/components/schemas/Platform"
    Choice:
      type: object
      additionalProperties: false
      required: [id, label, target_node_id, effect, effort, prominence]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        label:
          type: string
          minLength: 1
          maxLength: 160
        target_node_id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        effect:
          type: string
          enum: [advance, loop, retain, handoff]
        effort:
          type: integer
          minimum: 0
          maximum: 100
        prominence:
          type: string
          enum: [primary, secondary, subdued, ambiguous]
    RouteNode:
      type: object
      additionalProperties: false
      required: [id, kind, state, choices]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        kind:
          type: string
          enum: [screen, os_settings, handoff, terminal]
        state:
          type: [string, "null"]
          enum: [cancelled, retained, unavailable, null]
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
          maxItems: 30
    RouteGraph:
      type: object
      additionalProperties: false
      required: [entry_node_id, nodes]
      properties:
        entry_node_id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        nodes:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: "#/components/schemas/RouteNode"
    Friction:
      type: object
      additionalProperties: false
      required:
        - screens
        - retention_offers
        - loops
        - offline_handoff
        - effort_score
        - algorithm_version
      properties:
        screens:
          type: integer
          minimum: 0
        retention_offers:
          type: integer
          minimum: 0
        loops:
          type: integer
          minimum: 0
        offline_handoff:
          type: boolean
        effort_score:
          type: integer
          minimum: 0
        algorithm_version:
          type: string
          const: friction-v1
    EvidenceSummary:
      type: object
      additionalProperties: false
      required: [method, verification_sessions, change_summary]
      properties:
        method:
          type: string
          enum: [manual_clean_session]
        verification_sessions:
          type: integer
          minimum: 1
        change_summary:
          type: string
          minLength: 1
          maxLength: 280
    ExitRoute:
      type: object
      additionalProperties: false
      required:
        - id
        - service
        - outcome
        - variant
        - revision
        - status
        - verified_at
        - review_due_at
        - entry_url
        - graph
        - best_route
        - friction
        - confidence
        - evidence_summary
        - fingerprint
      properties:
        id:
          type: string
          format: uuid
        service:
          $ref: "#/components/schemas/ServiceRef"
        outcome:
          $ref: "#/components/schemas/Outcome"
        variant:
          $ref: "#/components/schemas/Variant"
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/RouteStatus"
        verified_at:
          type: string
          format: date-time
        review_due_at:
          type: string
          format: date-time
        entry_url:
          type: string
          format: uri
          maxLength: 2048
        graph:
          $ref: "#/components/schemas/RouteGraph"
        best_route:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        friction:
          $ref: "#/components/schemas/Friction"
        confidence:
          $ref: "#/components/schemas/Confidence"
        evidence_summary:
          $ref: "#/components/schemas/EvidenceSummary"
        fingerprint:
          type: string
          pattern: "^[a-f0-9]{64}$"
    RevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, status, verified_at, fingerprint, change_summary]
      properties:
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/RouteStatus"
        verified_at:
          type: string
          format: date-time
        fingerprint:
          type: string
          pattern: "^[a-f0-9]{64}$"
        change_summary:
          type: string
          minLength: 1
          maxLength: 280
    RevisionPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RevisionSummary"
        next_cursor:
          type: [string, "null"]
    ChangeEvent:
      type: object
      additionalProperties: false
      required: [id, occurred_at, service, variant, revision, event_type, summary]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        service:
          $ref: "#/components/schemas/ServiceRef"
        variant:
          $ref: "#/components/schemas/Variant"
        revision:
          type: integer
          minimum: 1
        event_type:
          type: string
          enum: [published, superseded, stale, withdrawn]
        summary:
          type: string
          minLength: 1
          maxLength: 280
    ChangePage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEvent"
        next_cursor:
          type: [string, "null"]
    ObservationInput:
      type: object
      additionalProperties: false
      required:
        - service_slug
        - outcome
        - variant
        - occurred_at
        - change_types
      properties:
        service_slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        observed_revision:
          type: [integer, "null"]
          minimum: 1
        outcome:
          $ref: "#/components/schemas/Outcome"
        variant:
          $ref: "#/components/schemas/Variant"
        occurred_at:
          type: string
          format: date-time
        change_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - entry_url_changed
              - choice_label_changed
              - step_added
              - step_removed
              - loop_added
              - retention_offer_added
              - offline_handoff_added
              - cancellation_terminal_missing
              - variant_mismatch
              - other
        note:
          type: [string, "null"]
          maxLength: 500
    ObservationReceipt:
      type: object
      additionalProperties: false
      required: [id, moderation_state, duplicate, received_at]
      properties:
        id:
          type: string
          format: uuid
        moderation_state:
          type: string
          const: queued
        duplicate:
          type: boolean
        received_at:
          type: string
          format: date-time
    DailyChallenge:
      type: object
      additionalProperties: false
      required: [id, date, title, graph, scoring, expires_at]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        title:
          type: string
          minLength: 1
          maxLength: 120
        graph:
          $ref: "#/components/schemas/RouteGraph"
        scoring:
          type: object
          additionalProperties: false
          required: [par_effort, trap_penalty]
          properties:
            par_effort:
              type: integer
              minimum: 0
            trap_penalty:
              type: integer
              minimum: 0
        expires_at:
          type: string
          format: date-time
    WebhookSubscriptionInput:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [route.published, route.stale, route.withdrawn]
    WebhookSubscriptionCreated:
      type: object
      additionalProperties: false
      required: [id, url, events, signing_secret, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [route.published, route.stale, route.withdrawn]
        signing_secret:
          type: string
          minLength: 32
          readOnly: true
        created_at:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: [string, "null"]
          format: uri-reference
        request_id:
          type: string
          minLength: 1
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
