openapi: 3.0.3
info:
  title: ExitRoute API
  description: A self-hosted informational API. It never authenticates to, operates, or stores credentials
    for a consumer account.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Health
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      tags:
      - system
      summary: Readiness
      operationId: getReadiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/challenges/daily:
    get:
      tags:
      - challenges
      summary: Get Daily Challenge
      operationId: getDailyChallenge
      parameters:
      - name: date
        in: query
        required: false
        schema:
          title: Date
          type: string
          format: date
          nullable: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyChallenge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/services:
    get:
      tags:
      - routes
      summary: List Services
      operationId: listServices
      security:
      - ApiKeyAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          title: Cursor
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/services/{service_slug}/exit-route:
    get:
      tags:
      - routes
      summary: Get Current Exit Route
      operationId: getCurrentExitRoute
      security:
      - ApiKeyAuth: []
      parameters:
      - name: service_slug
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Service Slug
      - name: region
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          default: US
          title: Region
      - name: platform
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Platform'
          default: web
      - name: If-None-Match
        in: header
        required: false
        schema:
          title: If-None-Match
          type: string
          nullable: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExitRouteView'
        '304':
          description: The cached representation is current.
          headers:
            ETag:
              description: Strong representation validator.
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/services/{service_slug}/exit-route/revisions:
    get:
      tags:
      - routes
      summary: List Revisions
      operationId: listExitRouteRevisions
      security:
      - ApiKeyAuth: []
      parameters:
      - name: service_slug
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Service Slug
      - name: region
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          default: US
          title: Region
      - name: platform
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Platform'
          default: web
      - name: cursor
        in: query
        required: false
        schema:
          title: Cursor
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionPage'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/services/{service_slug}/exit-route/revisions/{revision_number}:
    get:
      tags:
      - routes
      summary: Get Revision
      operationId: getExitRouteRevision
      security:
      - ApiKeyAuth: []
      parameters:
      - name: service_slug
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Service Slug
      - name: revision_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Revision Number
      - name: region
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          default: US
          title: Region
      - name: platform
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Platform'
          default: web
      - name: If-None-Match
        in: header
        required: false
        schema:
          title: If-None-Match
          type: string
          nullable: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExitRouteView'
        '304':
          description: The cached representation is current.
          headers:
            ETag:
              description: Strong representation validator.
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/changes:
    get:
      tags:
      - routes
      summary: List Changes
      operationId: listRouteChanges
      security:
      - ApiKeyAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          title: Cursor
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/observations:
    post:
      tags:
      - observations
      summary: Create Observation
      operationId: createObservation
      security:
      - ApiKeyAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationCreate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationReceipt'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/webhook-subscriptions:
    post:
