  /admin/v1/services:
    post:
      tags:
      - admin
      summary: Admin Create Service
      operationId: adminCreateService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
        required: true
      responses:
        '201':
