          format: uuid
          title: Subscription Id
      - name: cursor
        in: query
        required: false
        schema:
          title: Cursor
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
